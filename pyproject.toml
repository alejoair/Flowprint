[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowprint"
version = "0.1.0"
description = "Motor de orquestación multiagente estilo Blueprint de Unreal Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
flowprint = "flowprint.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/flowprint"]
